<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>AVOE Redesign</title>

	<link rel="stylesheet" href="./css/style.css">
</head>

<body>
	<!-- ================= Header ================= -->
	<header class="header">
		<div class="container header-container">
			<div class="logo">
				AVOE
			</div>
			<nav class="navbar">
				<ul class="nav-links">
					<li><a href="#">Home</a></li>
					<li><a href="#">Collection</a></li>
					<li><a href="#">About</a></li>
					<li><a href="#">Contact</a></li>
					<li><a href="#">Search</a></li>
					<li><a href="#">Cart</a></li>
					<li><a href="#">Login</a></li>
				</ul>
			</nav>
		</div>
	</header>

	<!-- ================= Main ================= -->
	<main>
		<!-- Hero -->
		<section id="hero">
			<div class="container hero-container">
				<div class="hero-content">
					<h1>Summer Collection</h1>
					<p>
						Discover your perfect swimwear.
					</p>
					<a href="#" class="btn">
						Shop Now
					</a>
				</div>
			</div>
		</section>

		<!-- Featured -->
		<section id="featured">
			<div class="container">
				<h2>Featured Products</h2>
				<div class="product-grid" id="product-grid">

				</div>
			</div>
		</section>

		<!-- About -->
		<section id="about">
			<div class="container">
				<h2>About Us</h2>
				<p>
					AVOE offers carefully selected fashion pieces for every season.
				</p>
			</div>
		</section>
	</main>

	<!-- ================= Footer ================= -->
	<footer>
		<p>
			© 2026 AVOE Official
		</p>

	</footer>
	<script src="./js/main.js"></script>

</body>

</html>
