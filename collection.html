<!DOCTYPE html>

	<link rel="stylesheet" href="./css/style.css">
</head>

<body>

	<header class="header">
		<div class="container header-container">

			<a href="./index.html" class="logo">
				AVOE
			</a>
			<button
				class="menu-toggle"
				type="button"
				aria-label="Toggle navigation menu"
				aria-expanded="false"
			>
				<span></span>
				<span></span>
				<span></span>

			</button>
			<nav class="navbar">
				<ul class="nav-links">

					<li>
						<a href="./index.html">Home</a>
					</li>

					<li>
						<a href="./collection.html">Collection</a>
					</li>

					<li>
						<a href="#">About</a>
					</li>

					<li>
						<a href="#">Contact</a>
					</li>

					<li>
						<a href="#">Search</a>
					</li>

					<li>

						</a>
					</li>

					<li>
						<a href="#">Login</a>
					</li>

				</ul>
			</nav>

	<main>

		<section class="collection-section">

			<div class="container">

				<h1 class="collection-title">
					Collection
				</h1>

				<div class="collection-controls">

					<input
						type="search"
						id="search-input"
						placeholder="Search products..."
					>

					<div class="category-filters">

						<button
							class="filter-btn active"
							data-category="All">
							All
						</button>

						<button
							class="filter-btn"
							data-category="Swimwear">
							Swimwear
						</button>

					</div>

				</div>

				<div
					class="product-grid"
					id="collection-grid">
				</div>

			</div>

		</section>

	<footer>
		<p>© 2026 AVOE Official</p>
	</footer>
